# 后端依赖锁文件 —— 本地与容器安装一律以此文件为准（pip install -r requirements.lock）。
# 生成方式：用干净虚拟环境按 requirements.txt 的范围约束解析后冻结，
#   python3 -m venv .venv-lock
#   .venv-lock/bin/pip install -r requirements.txt
#   .venv-lock/bin/pip freeze --all > requirements.lock
# 升级流程：先改 requirements.txt，再重新执行上面的解析命令并提交本文件。
# 解析环境：Python 3.11；锁内全部为纯 Python 或同时提供 manylinux/musllinux 轮的包，
# 容器基础镜像 python:3.12-slim（linux/amd64、linux/arm64）可直接安装。
